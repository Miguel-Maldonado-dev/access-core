%% Autorización por archivo de EMQX 5 (access-core).
%% Cada panel (usuario MQTT = panel_code) solo puede:
%%   - suscribirse a acc/<su panel_code>/cmd
%%   - publicar en acc/<su panel_code>/evt y acc/<su panel_code>/status
%% Todo lo demás se niega (también authorization.no_match = deny en emqx.conf).
{allow, all, subscribe, ["acc/${username}/cmd"]}.
{allow, all, publish, ["acc/${username}/evt", "acc/${username}/status"]}.
{deny, all}.
