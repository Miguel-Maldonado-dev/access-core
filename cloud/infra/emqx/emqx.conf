## Configuración declarativa de EMQX 5 para access-core (HOCON). ES UNA PLANTILLA.
## EMQX 5.8 no sustituye variables de entorno en HOCON: render-entrypoint.sh (ver
## docker-compose.yml) reemplaza los dos marcadores sin comillas de la URL de la aplicación y del
## secreto del webhook (los que aparecen más abajo en url y en el encabezado x-emqx-secret) por el
## valor de las variables del contenedor APP_URL y EMQX_WEBHOOK_SECRET antes de arrancar. Los
## marcadores entre comillas del usuario y la contraseña son propios de EMQX y no se tocan.

node { data_dir = "data" }

# API REST y dashboard (la aplicación publica por /api/v5/publish). Dentro del contenedor escucha
# en 18083; el compose solo lo publica en 127.0.0.1 del servidor.
dashboard.listeners.http.bind = 18083

listeners {
  tcp.default.enable = false
  ssl.default {
    enable = true
    bind = "0.0.0.0:8883"
    ssl_options {
      certfile = "/opt/emqx/etc/certs/fullchain.pem"
      keyfile = "/opt/emqx/etc/certs/privkey.pem"
      # Sin certificado de cliente (verify_none); cacertfile evita el aviso cert_file_not_found
      # del cacert.pem por defecto, que no existe.
      cacertfile = "/opt/emqx/etc/certs/fullchain.pem"
      verify = verify_none
    }
  }
  ws.default.enable = false
  wss.default {
    enable = true
    bind = "0.0.0.0:8084"   # el compose lo publica como 443
    ssl_options {
      certfile = "/opt/emqx/etc/certs/fullchain.pem"
      keyfile = "/opt/emqx/etc/certs/privkey.pem"
      cacertfile = "/opt/emqx/etc/certs/fullchain.pem"
    }
  }
  wss.default.websocket.mqtt_path = "/mqtt"
}

authentication = [
  {
    mechanism = password_based
    backend = http
    method = post
    url = ${APP_URL}"/api/mqtt/auth"
    headers {
      "content-type" = "application/json"
      "x-emqx-secret" = ${EMQX_WEBHOOK_SECRET}
    }
    body {
      username = "${username}"
      clientid = "${clientid}"
      password = "${password}"
    }
    connect_timeout = "5s"
    request_timeout = "5s"
    # TLS hacia la aplicación cuando APP_URL es https (render-entrypoint pone APP_TLS); se verifica
    # su certificado con los CA del sistema.
    ssl {
      enable = ${APP_TLS}
      verify = verify_peer
      cacertfile = "/etc/ssl/certs/ca-certificates.crt"
    }
  }
]

authorization {
  no_match = deny
  deny_action = disconnect
  sources = [
    { type = file, enable = true, path = "etc/acl.conf" }
  ]
}

connectors.http.acc_cloud {
  url = ${APP_URL}
  headers {
    "content-type" = "application/json"
    "x-emqx-secret" = ${EMQX_WEBHOOK_SECRET}
  }
  connect_timeout = "5s"
  ssl {
    enable = ${APP_TLS}
    verify = verify_peer
    cacertfile = "/etc/ssl/certs/ca-certificates.crt"
  }
}

actions.http.acc_events {
  connector = acc_cloud
  parameters {
    path = "/api/mqtt/events"
    method = post
    body = "${.}"
  }
}

rule_engine.rules.acc_events {
  sql = "SELECT * FROM \"$events/client_connected\", \"$events/client_disconnected\""
  actions = ["http:acc_events"]
}
